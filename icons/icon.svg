<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fc9"/>
      <stop offset="0.5" stop-color="#ff2e93"/>
      <stop offset="1" stop-color="#d400e0"/>
    </linearGradient>
    <clipPath id="ghostClip">
      <path d="M146,230 C146,150 190,100 256,100 C322,100 366,150 366,230 L366,340
        a27.5,27.5 0 0 1 -55,0
        a27.5,27.5 0 0 1 -55,0
        a27.5,27.5 0 0 1 -55,0
        a27.5,27.5 0 0 1 -55,0
        L146,230 Z"/>
    </clipPath>
    <g id="rosette">
