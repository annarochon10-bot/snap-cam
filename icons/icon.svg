    <use href="#rosette" transform="translate(312,152) rotate(24) scale(1.05)"/>
    <use href="#rosette" transform="translate(176,192) rotate(42) scale(0.85)"/>
    <use href="#rosette" transform="translate(230,186) rotate(-12) scale(1.1)"/>
    <use href="#rosette" transform="translate(284,190) rotate(16) scale(0.95)"/>
    <use href="#rosette" transform="translate(338,202) rotate(-32) scale(1)"/>
    <use href="#rosette" transform="translate(198,234) rotate(12) scale(1.1)"/>
    <use href="#rosette" transform="translate(256,226) rotate(-26) scale(0.9)"/>
    <use href="#rosette" transform="translate(312,238) rotate(34) scale(1)"/>
    <use href="#rosette" transform="translate(176,272) rotate(-16) scale(0.95)"/>
    <use href="#rosette" transform="translate(228,274) rotate(20) scale(1)"/>
    <use href="#rosette" transform="translate(282,268) rotate(-10) scale(1.1)"/>
