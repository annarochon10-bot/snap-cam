    a27.5,27.5 0 0 1 -55,0
    a27.5,27.5 0 0 1 -55,0
    a27.5,27.5 0 0 1 -55,0
    a27.5,27.5 0 0 1 -55,0
    L146,230 Z"
    fill="none" stroke="#20101a" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
