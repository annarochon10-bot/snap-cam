      <ellipse cx="1" cy="-2" rx="5.2" ry="4.2" fill="#ff2e93"/>
    </g>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Leopard print fill, clipped to ghost silhouette -->
