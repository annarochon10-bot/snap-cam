<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0006">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phantom Cam">
<meta name="mobile-web-app-capable" content="yes">
<title>Phantom Cam</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- Camera screen -->
  <div id="camera-screen" class="screen active">
    <div id="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <div id="record-glow"></div>
      <div id="flash-flash"></div>
    </div>

    <div id="top-bar">
      <div id="brand">
        <img src="icons/icon-192.png" alt="" id="brand-icon">
      </div>
      <button id="flip-btn" class="icon-btn" aria-label="Retourner la caméra">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v3l4-4-4-4v3c-3.31 0-6-2.69-6-6z"/></svg>
      </button>
    </div>

    <div id="hint" class="hint">Touche 2x pour retourner • Maintiens pour filmer</div>

    <div id="bottom-bar">
      <button id="memories-btn" class="side-btn" aria-label="Souvenirs">
        <div id="memories-thumb" class="memories-thumb">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zM11 12l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
        </div>
        <span class="side-label">Souvenirs</span>
      </button>

      <button id="capture-btn" aria-label="Capturer">
        <div id="capture-ring"></div>
        <div id="capture-core"></div>
      </button>

      <button id="switch-camera-btn" class="side-btn" aria-label="Changer de caméra">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        <span class="side-label">Caméra</span>
      </button>
    </div>
  </div>

  <!-- Memories screen -->
  <div id="memories-screen" class="screen">
    <div id="memories-header">
      <button id="close-memories-btn" class="icon-btn" aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <span id="memories-title">Souvenirs</span>
      <span class="memories-count" id="memories-count"></span>
    </div>
    <div id="memories-grid"></div>
    <div id="memories-empty" class="memories-empty" hidden>
      <div class="ghost-empty">👻</div>
      <p>Aucun souvenir pour l'instant.<br>Capture une photo ou une vidéo !</p>
    </div>
  </div>

  <!-- Fullscreen viewer -->
  <div id="viewer-screen" class="screen">
    <div id="viewer-content"></div>
    <div id="viewer-bar">
      <button id="viewer-close-btn" class="icon-btn" aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <button id="viewer-save-btn" class="icon-btn" aria-label="Enregistrer">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg>
      </button>
      <button id="viewer-delete-btn" class="icon-btn" aria-label="Supprimer">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
    </div>
  </div>

  <div id="permission-screen" class="screen">
    <div class="ghost-empty">👻</div>
    <h2>Accès à la caméra requis</h2>
    <p id="permission-text">Autorise l'accès à la caméra et au micro pour utiliser Phantom Cam.</p>
    <button id="permission-retry-btn" class="pill-btn">Réessayer</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
